<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />

    <title>Tic-Tac-Toe</title>
  </head>
  <body>
    <header>
      <h1>Tic Tac Toe</h1>
      <p class="instructions"></p>
    </header>
    <main>
      <div class="winner-bar winner-bar--shape hidden"></div>
      <div class="board-top">
        <div class="cell cell--0">
          <i class="move--0 material-icons-outlined"></i>
        </div>
        <div class="cell cell--1">
          <i class="move--1 material-icons-outlined"></i>
        </div>
        <div class="cell cell--2">
          <i class="move--2 material-icons-outlined"></i>
        </div>
        <div class="cell cell--3">
          <i class="move--3 material-icons-outlined"></i>
        </div>
        <div class="cell cell--4">
          <i class="move--4 material-icons-outlined"></i>
        </div>
        <div class="cell cell--5">
          <i class="move--5 material-icons-outlined"></i>
        </div>
        <div class="cell cell--6">
          <i class="move--6 material-icons-outlined"></i>
        </div>
        <div class="cell cell--7">
          <i class="move--7 material-icons-outlined"></i>
        </div>
        <div class="cell cell--8">
          <i class="move--8 material-icons-outlined"></i>
        </div>
      </div>

      <div class="board">
        <div class="vertical-lines">
          <div class="line vertical-line vertical-line-1"></div>
          <div class="line vertical-line vertical-line-2"></div>
        </div>
        <div class="horizontal-lines">
          <div class="line horizontal-line horizontal-line-1"></div>
          <div class="line horizontal-line horizontal-line-2"></div>
        </div>
      </div>
    </main>
    <a class="btn">New Game</a>
    <script src="script.js"></script>
  </body>
</html>
